<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    
    <!-- Neon Sync Gradient -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" /> <!-- Purple -->
      <stop offset="50%" stop-color="#3b82f6" /> <!-- Blue -->
      <stop offset="100%" stop-color="#14b8a6" /> <!-- Teal -->
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Elements (Subtle Sync Rotation Indicators) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="16 32" opacity="0.25" />

  <!-- The Interlocking TaskSync Loop (Synchronization Symbol) -->
  <g filter="url(#neonGlow)">
    <!-- Main Sync Loop Path -->
    <path d="M 256,120 
             A 136,136 0 1,1 120,256 
             L 160,256 
             A 96,96 0 1,0 256,160 
             L 256,120 Z" 
          fill="url(#syncGrad)" />

    <path d="M 256,392 
             A 136,136 0 1,1 392,256 
             L 352,256 
             A 96,96 0 1,0 256,352 
             L 256,392 Z" 
          fill="url(#syncGrad)" opacity="0.85" />
          
    <!-- Synchronous Checkmark Symbol in Center -->
    <path d="M 200,250 L 240,290 L 320,195" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Rotation Direction Indicator Arrows -->
  <polygon points="256,100 276,130 236,130" fill="#a855f7" />
  <polygon points="256,412 236,382 276,382" fill="#14b8a6" />
</svg>
